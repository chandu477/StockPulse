# Render Blueprint: StockPulse backend (Spring Boot, Docker) on the free plan.
# Database: free Neon Postgres (https://neon.tech). RabbitMQ is not needed: messaging runs in-process.
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: stockpulse-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: STOCKPULSE_MESSAGING_MODE
        value: in-process
      - key: MANAGEMENT_HEALTH_RABBIT_ENABLED
        value: "false"
      - key: SPRING_RABBITMQ_LISTENER_SIMPLE_AUTO_STARTUP
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-Xss512k -XX:MaxRAMPercentage=70"
      # Neon: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Your Vercel URL, e.g. https://stockpulse.vercel.app (comma-separate several)
      - key: STOCKPULSE_CORS_ALLOWED_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_BASE_URL
        value: https://api.groq.com
      - key: LLM_API_KEY
        sync: false
