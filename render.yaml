# Render Blueprint for the StockPulse backend (Spring Boot, Docker).
# Vercel/Netlify only host the Angular frontend; the Java backend needs a container host.
# Postgres: Neon (free). RabbitMQ: CloudAMQP (free "Little Lemur"). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: stockpulse-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: STOCKPULSE_MESSAGING_MODE
        value: rabbitmq
      - key: STOCKPULSE_LOGGING_DIR
        value: /app/logs
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k
      # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # CloudAMQP URL, e.g. amqps://user:pass@host/vhost (overrides RABBITMQ_HOST/PORT)
      - key: SPRING_RABBITMQ_ADDRESSES
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      # Comma-separated frontend origins, e.g. https://stockpulse.vercel.app,https://stockpulse.netlify.app
      - key: STOCKPULSE_CORS_ALLOWED_ORIGINS
        sync: false
